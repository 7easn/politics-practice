<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Kiky 的私人学习室</title><link rel="stylesheet" href="learning/style.css"><style>.login-wrap{max-width:600px;margin:9vh auto;padding:28px}.login-wrap h1{font-size:38px}.login-wrap label{display:block;margin:18px 0}.login-wrap input{display:block;width:100%;margin-top:8px;padding:12px;border:1px solid #ccd5ce;border-radius:8px;font:inherit}.owner-tools{padding:18px 28px;background:#fff;border-bottom:1px solid #d6ded7;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.owner-tools details{flex:1}#notesPanel{padding:28px;max-width:1000px;margin:auto}#privateApp[hidden],#ownerBar[hidden],#loginPanel[hidden],#notesPanel[hidden]{display:none!important}</style><script src="learning/config.js" defer></script><script src="learning/sync.js" defer></script><script src="learning/shell.js" defer></script><script src="learning/access.js" defer></script></head>
<body><main class="login-wrap" id="loginPanel" data-private-login><p class="eyebrow">KIKY · PRIVATE STUDY ROOM</p><h1>登录私人学习室</h1><p>题库、答案、解析、来源和笔记仅向通过本人允许名单的账户提供。</p><form id="privateLogin"><label>本人账户邮箱<input id="ownerEmail" type="email" autocomplete="username" required></label><label>密码<input id="ownerPassword" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit" id="passwordLogin">登录</button></form><p><button class="btn" id="emailLogin">改用邮箱登录链接</button></p><p id="accessMessage" role="status" aria-live="polite">正在检查会话…</p><p class="fine">已有浏览器学习记录保留。密码仅用于向 Supabase 官方认证服务登录，不保存在学习记录中。</p></main>
<div id="ownerBar" class="owner-tools" hidden><span>本人账户已验证</span><button class="btn" id="openStudy">心理学学习</button><button class="btn" id="openNotes">原始笔记</button><button class="btn" id="logoutOwner">退出</button><details><summary>内容管理</summary><p>将收到的私有 JSON 导入本人服务端账户，后续设备登录后读取。重复导入按同一文档替换，题号保持稳定，学习记录不删除。</p><label>内容类型<select id="privateKind"><option value="psychology">心理学题库</option><option value="notes">笔记原文索引</option><option value="documents">8份原始 Word</option></select></label><input type="file" id="privateFile" accept=".json,application/json"><button class="btn" id="uploadPrivate">导入本人私有内容</button><span id="uploadMessage" role="status"></span></details></div>
<div id="privateApp" hidden></div><section id="notesPanel" hidden><h1>原始笔记</h1><p>原文保留笔记中的错误和断句，请结合修正与待核验提示阅读。</p><label>筛选原文<input type="search" id="noteSearch" placeholder="文件名、段落 ID、关键词"></label><button class="btn" id="loadNotes">读取本人笔记</button><button class="btn" id="loadDocuments">读取原始 Word 下载入口</button><div id="privateNotes"></div><div id="privateDocuments"></div></section></body></html>
