<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store"><title>Kiky 的学习室</title><style>body{margin:0;background:#f5f3ed;color:#182b33;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:620px;margin:10vh auto;padding:32px}h1{font-size:38px}p{line-height:1.8;color:#516568}.card{background:white;border:1px solid #d6ded7;border-radius:18px;padding:28px}.status{font-size:13px;color:#245f54}</style></head><body><main><p class="status">KIKY · 私人学习室</p><h1>学习室维护中</h1><div class="card"><p>正在接入本人账户登录与服务端访问权限。</p><p>题库、答案、解析、来源及笔记仅在登录并通过本人允许名单后提供。</p><p>已有浏览器学习记录保留，请勿清除浏览器数据。</p></div></main><script>if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister())))}if('caches' in window){caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k))))}</script></body></html>
