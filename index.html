<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Kiky 的私人学习室</title><link rel="stylesheet" href="learning/style.css?v=20261003-subject-package-deflate-v14"><style>.login-wrap{max-width:600px;margin:9vh auto;padding:28px}.login-wrap h1{font-size:38px}.login-wrap label{display:block;margin:18px 0}.login-wrap input{display:block;width:100%;margin-top:8px;padding:12px;border:1px solid #ccd5ce;border-radius:8px;font:inherit}.owner-tools{padding:18px 28px;background:#fff;border-bottom:1px solid #d6ded7;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.owner-tools details{flex:1}#notesPanel{padding:28px;max-width:1000px;margin:auto}#privateApp[hidden],#ownerBar[hidden],#loginPanel[hidden],#notesPanel[hidden]{display:none!important}</style><script src="learning/config.js?v=20261003-subject-package-deflate-v14" defer></script><script src="learning/subjective-merge.js?v=20261003-subject-package-deflate-v14" defer></script><script src="learning/subject-package.js?v=20261003-subject-package-deflate-v14" defer></script><script src="learning/sync.js?v=20261003-subject-package-deflate-v14" defer></script><script src="learning/shell.js?v=20261003-subject-package-deflate-v14" defer></script><script src="learning/manager.js?v=20261003-subject-package-deflate-v14" defer></script><script src="learning/access.js?v=20261003-native-deflate-v14" defer></script></head>
<body><main class="login-wrap" id="loginPanel" data-private-login><form id="privateLogin"><label>账号（邮箱）<input id="ownerEmail" type="email" autocomplete="username" required></label><label>密码<input id="ownerPassword" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit" id="passwordLogin">登录</button></form><p id="accessMessage" role="status" aria-live="polite" hidden></p></main>
<div id="ownerBar" class="owner-tools" hidden><button class="save-badge" id="saveStatus" title="查看同步详情与处理冲突">仅本机保存</button><details id="accountMenu" class="account-menu"><summary>我的账号</summary><div class="account-actions"><button class="btn" id="accountBackup">备份与恢复 · 学习统计</button><button class="btn" id="logoutOwner">退出登录</button></div></details></div>
<div id="privateApp" hidden></div><main id="managePanel" hidden><header><div><p class="eyebrow">PRIVATE CONTENT</p><h1>题库与资料管理</h1></div></header><nav class="management-nav" aria-label="资料管理分区"><button class="btn" data-management-section="bank">题库版本与导入</button><button class="btn" data-management-section="notes">原始笔记</button><button class="btn" data-management-section="corrections">笔记修正</button><button class="btn" data-management-section="sources">权威来源</button></nav><section id="managerBankSection"><div id="managerVersionSection"></div><p class="notice">先解压导入包，按下方三类分别选择 JSON。选择文件只在本机校验；点击“导入”后才上传本人账户。</p><div id="contentImportCards" class="import-grid"></div><p class="fine">格式与 SHA256 校验用于识别文件，不代表内容全部核验正确。未审题仍保留待审状态。</p><div class="actions"><button class="btn primary" id="refreshPrivate" disabled>加载已导入内容</button></div><p id="importOverview" role="status" aria-live="polite"></p></section><section id="managerNotesSection" hidden></section><section id="managerStudySection" hidden></section></main><main id="notesPanel" hidden><h1>原始笔记</h1><p>原文保留笔记中的错误和断句，请结合修正与待核验提示阅读。</p><label>筛选原文<input type="search" id="noteSearch" placeholder="文件名、段落 ID、关键词"></label><button class="btn" id="loadNotes">读取本人笔记</button><button class="btn" id="loadDocuments">读取原始 Word 下载入口</button><div id="privateNotes"></div><div id="privateDocuments"></div></main></body></html>
