name: Validate private learning shell
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  privacy-and-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate public tree
        run: python3 scripts/validate_public_tree.py
      - name: Check client and account isolation
        run: |
          node --check learning/app.js
          node --check learning/access.js
          node --check learning/sync.js
          node --check learning/manager.js
          node --check learning/subjective-merge.js
          node --check learning/native-subjective-view.js
          node --check learning/subject-package.js
          node scripts/test_sync.cjs
          node scripts/test_record_restore.cjs
          node scripts/test_content_chunks.cjs
          node scripts/test_answer_display.cjs
          node scripts/test_source_display.cjs
          node scripts/test_subjective_merge.cjs
          node scripts/test_subject_package.cjs
          node scripts/test_subject_package_sync.cjs
          python3 scripts/test_question_release_gate.py
      - name: Install pinned browser for private cache regression
        run: |
          npm install --prefix "$RUNNER_TEMP/psychology-browser-check" --no-save --package-lock=false playwright@1.57.0
          "$RUNNER_TEMP/psychology-browser-check/node_modules/.bin/playwright" install --with-deps chromium
      - name: Require real IndexedDB cache lifecycle regression
        timeout-minutes: 5
        run: |
          PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/psychology-browser-check/node_modules/playwright" node scripts/test_subject_package_browser.cjs
